<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>inventory</title>
		<meta name="theme-color" content="#6300a6">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="inventory">
		<meta name="mobile-web-app-capable" content="yes">
		<link rel="manifest" href="/manifest.webmanifest">
		<link rel="icon" href="/favicon.ico" sizes="48x48">
		<link rel="icon" href="/logo.svg" sizes="any" type="image/svg+xml">
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
		<script>
			// Apply stored settings before first paint to avoid a flash of the
			// default accent color.
			try {
				var s = JSON.parse(localStorage.getItem("inventory:settings") || "null")
				if (s) {
					var p = s.palette || {}
					for (var k in p) {
						document.documentElement.style.setProperty("--color-primary-" + k, p[k])
					}
					if (s.accent) {
						document.documentElement.style.setProperty("--color-primary", s.accent)
						var m = document.querySelector('meta[name="theme-color"]')
						if (m) m.setAttribute("content", s.accent)
					}
					var px = { compact: "15px", normal: "16px", large: "17.5px" }[s.uiScale]
					if (px) document.documentElement.style.fontSize = px
					var radius = {
						round: {
							lg: "0.5rem",
							xl: "0.75rem",
							"2xl": "1rem",
							"3xl": "1.5rem",
							pill: "9999px",
						},
						medium: {
							lg: "0.25rem",
							xl: "0.5rem",
							"2xl": "0.625rem",
							"3xl": "1rem",
							pill: "1rem",
						},
						square: { lg: "0", xl: "0", "2xl": "0", "3xl": "0", pill: "0" },
					}[s.radius]
					if (radius) {
						for (var rk in radius) {
							document.documentElement.style.setProperty("--radius-" + rk, radius[rk])
						}
					}
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
